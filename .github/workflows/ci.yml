name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'checkpoint/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y curl jq mpv ffmpeg util-linux
      - name: Python tests, no unexpected skips
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Public package contract
        run: |
          python3 -B tools/check-publication.py
          bash -n bin/speak lib/config.sh providers/teratts ocr/remote
          jq -e '.id == "io.github.pavellizunov.teratts" and .entryPoints.barWidget == "BarWidget.qml"' manifest.json
          test -x bin/speak && test -x providers/teratts
